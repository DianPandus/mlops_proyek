name: MLOps CI-CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # =========================================================
  # CI: Scraping → ETL → Training → Sanity Check
  # =========================================================
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies (FULL)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧹 Run scraping
        run: |
          python src/scrapping/scrapping_dataset.py

      - name: 🔄 Run preprocessing (ETL)
        run: |
          python src/etl/preprocess.py

      - name: 🧠 Train models
        run: |
          python src/training/train_models.py

      - name: ✅ Check model artifacts
        run: |
          test -f models/metadata.json
          test -f models/vectorizer.pkl
          test -f models/label_encoder.pkl

      - name: 🚀 Sanity check FastAPI
        run: |
          python - <<EOF
          import src.api.app
          print("FastAPI import OK")
          EOF

  # =========================================================
  # CD: Build & Push Docker Image (API)
  # =========================================================
  cd:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗 Build Docker image (FastAPI)
        run: |
          docker build -f docker/Dockerfile.api -t dianpandus/floq:latest .

      - name: 🚀 Push image to Docker Hub
        run: |
          docker push dianpandus/floq:latest
