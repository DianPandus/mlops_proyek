name: MLOps CI-CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # 08:00 WIB

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies (FULL)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_full.txt

      - name: 🧹 Run scraping
        run: |
          python src/scrapping/scrapping_dataset.py

      - name: 🔄 Run preprocessing (ETL)
        run: |
          python src/etl/preprocess.py

      - name: 🧠 Train models
        run: |
          python src/training/train_models.py

      - name: ✅ Check model artifacts
        run: |
          test -f models/metadata.json
          test -f models/vectorizer.pkl
          test -f models/label_encoder.pkl

      - name: 🚀 Sanity check FastAPI
        run: |
          python - <<EOF
          import src.api.app
          print("FastAPI import OK")
          EOF

      - name: 🚀 Commit and Push updated data/models
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/*.csv data/processed/*.csv models/*.pkl models/metadata.json
          git commit -m "Automated data & model update: $(date)" || echo "No changes to commit"
          git push

  cd:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗 Build Docker image (FastAPI)
        run: |
          docker build -f docker/Dockerfile.api -t dianpandus/floq:latest .

      - name: 🚀 Push image to Docker Hub
        run: |
          docker push dianpandus/floq:latest
