name: MLOps CI & Scheduled Retraining

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  schedule:
    # Setiap Minggu Senin jam 02:00 WIB (19:00 UTC hari Minggu)
    - cron: "0 19 * * 0"

jobs:
  build-train:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🕷️ Scraping new data
        run: |
          python src/scrapping/scrapping_dataset.py

      - name: 🔄 ETL preprocessing
        run: |
          python src/etl/preprocess.py

      - name: 🧠 Retrain models
        run: |
          python src/training/train_models.py

      - name: 📦 Validate model artifacts
        run: |
          test -f models/logreg_model.pkl
          test -f models/vectorizer.pkl
          test -f models/metadata.json

      - name: 🚀 Sanity check API
        run: |
          python - <<EOF
          from src.api.app import app
          print("API loaded successfully")
          EOF
