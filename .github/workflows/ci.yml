name: MLOps CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-full.txt

      - name: 🧹 Run scraping
        run: |
          python src/scrapping/scrapping_dataset.py

      - name: 🔄 Run preprocessing (ETL)
        run: |
          python src/etl/preprocess.py

      - name: 🧠 Run model training
        run: |
          python src/training/train_models.py

      - name: ✅ Check model artifacts
        run: |
          test -f models/metadata.json
          test -f models/vectorizer.pkl
          test -f models/logreg_model.pkl

      - name: 🚀 Sanity check FastAPI
        run: |
          python - <<EOF
          import src.api.app
          print("API module import OK")
          EOF
