name: MLOps Full CI/CD

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 1 * * *" # 08:00 WIB

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install deps
        run: |
          pip install -r requirements.txt

      - name: 🔄 Scraping
        run: |
          python src/data/scrapping_dataset.py

      - name: 🧹 Preprocess
        run: |
          python src/data/preprocess.py

      - name: 🧠 Train Model
        run: |
          python src/training/train_models.py

      - name: 🐳 Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗 Build & Push API
        run: |
          docker build -f docker/Dockerfile.api -t ${{ secrets.DOCKER_USERNAME }}/floq-api:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/floq-api:latest

      - name: 🏗 Build & Push Dashboard
        run: |
          docker build -f docker/Dockerfile.dashboard -t ${{ secrets.DOCKER_USERNAME }}/floq-dashboard:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/floq-dashboard:latest
